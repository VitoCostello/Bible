<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibles</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://kit.fontawesome.com/8ecd517ba7.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="page">
    <header class="navbar">
      <a class="logo logo-dark" href="index.html" aria-label="Bibles">
        <span class="logo-mark" aria-hidden="true"> <i class="fa-solid fa-book-bible"></i> </span>
        <span>Bibles</span>
      </a>

      <nav class="nav-links">
        <a class="nav-home" href="index.html">Home</a>
        <a href="bibles.html">Bibles</a>
      </nav>
    </header>

    <main class="home-main">
      <h1 class="home-title">
        United States most awarded<br>
        Bible search platform
      </h1>

      <h2 class="home-subtitle">
        FIND YOUR IDEAL BIBLE
      </h2>

      <form class="search-row" action="bibles.html">
        <input
          class="search-input"
          type="search"
          name="search"
          placeholder="Search Bible Version, Language or Keyword"
          aria-label="Search Bible Version, Language or Keyword"
        >
        <button class="search-button" type="submit" aria-label="Search">
          <span class="search-icon" aria-hidden="true"></span>
        </button>
      </form>


      </div>
    </main>
  </div>
</body>
</html>
